plugins {
    id 'java'
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
    id 'io.freefair.lombok' version "9.2.0"

}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def restAssuredVersion = "5.5.0",
    selenideVersion = "7.13.0",
    allureVersion = "2.29.0",
    junitVersion = "5.11.0",
    appiumVersion = "10.0.0",
    seleniumVersion = "4.39.0",
    httpclientVersion = "4.5.14",
    slf4jVersion = "2.0.17"

allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            //"tools.jackson.core:jackson-databind:3.1.0",
            //"com.fasterxml.jackson.core:jackson-databind:2.17.2",
            "net.datafaker:datafaker:2.5.4",
            "org.assertj:assertj-core:3.27.7",
            "org.aeonbits.owner:owner:1.0.12",
            "commons-io:commons-io:2.16.1",

           // "org.junit.jupiter:junit-jupiter-api:5.11.0",
           // "org.junit.jupiter:junit-jupiter-engine:5.11.0",
            //"org.slf4j:slf4j-simple:$slf4jVersion",
            "org.freemarker:freemarker:2.3.32",
           "ch.qos.logback:logback-classic:1.5.6",
            "org.seleniumhq.selenium:selenium-api:$seleniumVersion",
            "org.seleniumhq.selenium:selenium-remote-driver:$seleniumVersion",
            "org.seleniumhq.selenium:selenium-support:$seleniumVersion",
            "org.apache.httpcomponents:httpclient:$httpclientVersion"
    )
    testImplementation("io.appium:java-client:$appiumVersion") {
        exclude group: 'org.seleniumhq.selenium'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    test {
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(JavaExec).configureEach {
    systemProperty "file.encoding", "UTF-8"
    jvmArgs "-Dfile.encoding=UTF-8"
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs ("-Dfile.encoding=UTF-8",
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "--add-opens", "java.base/java.security=ALL-UNNAMED",
            "--add-opens", "java.base/sun.security.ssl=ALL-UNNAMED",
            "--add-opens", "jdk.crypto.ec/sun.security.ec.ed=ALL-UNNAMED")

    jvmArgs "-Dallure.listener=extensions.ManualTestListener"

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}